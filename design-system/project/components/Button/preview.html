<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div id="root"></div>
<script>
  var W = window.Werkgoed, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'wg-row' },
      h(W.Button, { variant: 'signal' }, 'Kies je beroep'),
      h(W.Button, { variant: 'ink' }, 'Bekijk de showroom'),
      h(W.Button, { variant: 'outline', arrow: false }, 'Klantportaal'),
      h(W.Button, { variant: 'link' }, 'Alle merken')),
    h('div', { className: 'wg-row wg-night', style: { background: 'var(--night)' } },
      h(W.Button, { variant: 'signal' }, 'Plan je voetscan'),
      h(W.Button, { variant: 'light' }, 'Route'),
      h(W.Button, { variant: 'outline-light', arrow: false }, 'Bel ons'))
  ));
</script>
</body>
</html>
