<!-- @dsCard height=288 -->
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Werkgoed</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:640px; height:288px; }
  .canv { fill:var(--canvas); }
  .deep { fill:var(--marine); }
  .t1 { fill:var(--beroep-las); } .t2 { fill:var(--beroep-straat); } .t3 { fill:var(--beroep-bouw); } .t4 { fill:var(--beroep-techniek); }
  .flame { fill:var(--vlam); }
  .stripe { stroke:var(--signal); stroke-width:8; fill:none; }
  .blk { rx:var(--radius-tile); }
  .words { position:absolute; left:var(--space-6); right:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.95; font-weight:700; font-variation-settings:'wdth' 90; letter-spacing:-.035em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 640 288" width="640" height="288">
<!--
  blocks      canvas 144x240 bled off the top (warm werkkatoen) · four beroep tints 64x68 in a 2x2 grid (las, straat, bouw, techniek) · marine 304x216 bleeding off the right edge · vlam 64x24 once (the support colour, only ever a small badge)
  pattern     diagonal stripes in signal cut across the marine block at a 32px pitch: the hazard band of workwear, the only yellow
  scales      sides in space-2 multiples; gutters space-4; corners radius-tile (14px)
-->
<defs><clipPath id="nb"><rect x="336" y="48" width="304" height="216" rx="14"/></clipPath></defs>
<rect class="canv blk" x="16" y="-16" width="144" height="240" rx="14"/>
<rect class="flame" x="16" y="240" width="64" height="24" rx="12"/>
<rect class="t1" x="176" y="112" width="64" height="68" rx="14"/>
<rect class="t2" x="256" y="112" width="64" height="68" rx="14"/>
<rect class="t3" x="176" y="196" width="64" height="68" rx="14"/>
<rect class="t4" x="256" y="196" width="64" height="68" rx="14"/>
<rect class="deep blk" x="336" y="48" width="304" height="216" rx="14"/>
<g clip-path="url(#nb)">
<line class="stripe" x1="120" y1="264" x2="336" y2="48"/>
<line class="stripe" x1="152" y1="264" x2="368" y2="48"/>
<line class="stripe" x1="184" y1="264" x2="400" y2="48"/>
<line class="stripe" x1="216" y1="264" x2="432" y2="48"/>
<line class="stripe" x1="248" y1="264" x2="464" y2="48"/>
<line class="stripe" x1="280" y1="264" x2="496" y2="48"/>
<line class="stripe" x1="312" y1="264" x2="528" y2="48"/>
<line class="stripe" x1="344" y1="264" x2="560" y2="48"/>
<line class="stripe" x1="376" y1="264" x2="592" y2="48"/>
<line class="stripe" x1="408" y1="264" x2="624" y2="48"/>
<line class="stripe" x1="440" y1="264" x2="656" y2="48"/>
<line class="stripe" x1="472" y1="264" x2="688" y2="48"/>
</g>
</svg>
</div>
<div class="words">
<h1 class="name">Werkgoed</h1>
<p class="tag">Past altijd goed. Bij 't werk wat je doet.</p>
</div>
</div>
</body>
</html>
