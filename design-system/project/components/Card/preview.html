<!-- @dsCard group="Kaarten" height=200 -->
<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>Card</title></head>
<body>
<div id="root" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px"></div>
<script>
  var W = window.Werkgoed, h = React.createElement;
  function inner(t, s) { return [h('h3', { key: 't', className: 'wg-heading wg-h3', style: { marginBottom: 8 } }, t), h('p', { key: 's', className: 'wg-body', style: { margin: 0 } }, s)]; }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(W.Card, { tone: 'sunken' }, inner('Werkkleding', 'Jassen, broeken, overalls.')),
    h(W.Card, { tone: 'canvas' }, inner('Werkschoenen', 'Pas ze in de showroom.')),
    h(W.Card, { tone: 'surface' }, inner('Werkhandschoenen', 'Montage tot lassen.')),
    h(W.Card, { tone: 'marine' }, inner('PBM', 'Hoofd, gehoor, ademhaling.')),
    h(W.Card, { tone: 'signal' }, inner('Twijfel je?', 'Bel 0184-701212.')),
    h(W.Card, { tone: 'vlam' }, inner('Let op', 'Geen synthetische onderlaag bij het lassen.'))
  ));
</script>
</body>
</html>
