<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>BeroepKaart</title></head>
<body>
<div id="root" style="padding:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px"></div>
<script>
  var W = window.Werkgoed, h = React.createElement;
  var b = [
    ['las', 'las', 'Vonken, hitte en lasrook.', ['vonk', 'hitte', 'stof']],
    ['straat', 'straat', 'Op je knieën, langs de weg, in elk weer.', ['zicht', 'knielen', 'regen']],
    ['bouw', 'bouw', 'Hoogte, stof en lawaai op de bouwplaats.', ['hoogte', 'stof', 'lawaai']],
    ['techniek', 'techniek', 'Kruipen, knielen en precies werken.', ['knielen', 'snijden', 'zicht']],
    ['magazijn', 'magazijn', 'Tussen pallets, heftrucks en koude hallen.', ['zicht', 'kou', 'snijden']],
    ['chauffeur', 'chauffeurs', 'Urenlang rijden, laden en lossen.', ['zicht', 'kou', 'snijden']],
    ['groen', 'groen', 'Buiten met machines, takken en weer.', ['lawaai', 'regen', 'snijden']],
    ['schilder', 'schilders', 'Spatten, dampen en lange dagen op de trap.', ['chemie', 'stof', 'hoogte']]
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, b.map(function (x) {
    return h(W.BeroepKaart, { key: x[0], beroep: x[0], naam: x[1], regel: x[2], risicos: x[3] });
  })));
</script>
</body>
</html>
